name: Publier les fichiers d'une version

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validateur officiel de plugins
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .
      - name: Fabriquer un .zip par skill
        run: python .github/scripts/empaqueter.py dist
      - name: Joindre les .zip à la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
